<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --gold:#D4A843;--blue:#2563eb;--coral:#FF6F61;
  --bg:#050510;--panel-bg:rgba(8,8,24,0.92);
  --text:#e8e8f0;--text-dim:#8888aa;
}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}
#canvas-container{position:fixed;top:0;left:0;width:100%;height:100%;z-index:1}
#canvas-container canvas{display:block}

/* Header */
#header{position:fixed;top:0;left:0;right:0;z-index:100;text-align:center;padding:10px 20px 6px;background:linear-gradient(180deg,rgba(5,5,16,0.95) 0%,rgba(5,5,16,0.5) 70%,transparent 100%);pointer-events:none}
#header h1{font-size:clamp(18px,3.2vw,30px);font-weight:300;letter-spacing:6px;background:linear-gradient(90deg,var(--gold),#fff,var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
#header .subtitle{font-size:clamp(10px,1.4vw,13px);color:var(--text-dim);letter-spacing:3px;margin-top:2px}
#header .desc{font-size:clamp(10px,1.2vw,12px);color:var(--text-dim);margin-top:4px;max-width:680px;margin-left:auto;margin-right:auto;line-height:1.6;opacity:0.6}

/* Event count */
#event-count{position:fixed;top:10px;right:16px;z-index:110;font-size:14px;color:var(--text-dim);background:rgba(8,8,24,0.8);padding:8px 18px;border-radius:20px;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(10px)}
#event-count span{color:#fff;font-weight:600;font-size:20px}

/* Filters */
#filters{position:fixed;top:10px;left:16px;z-index:110;display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{font-size:13px;padding:7px 18px;border-radius:18px;border:1px solid rgba(255,255,255,0.12);background:rgba(8,8,24,0.75);color:var(--text-dim);cursor:pointer;transition:all 0.3s;backdrop-filter:blur(8px);user-select:none;font-weight:500}
.filter-btn:hover{border-color:rgba(255,255,255,0.3);color:var(--text)}
.filter-btn.active{color:#fff;border-color:rgba(255,255,255,0.4)}
.filter-btn[data-el="humanities"].active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,0.12)}
.filter-btn[data-el="digital"].active{border-color:var(--blue);color:var(--blue);background:rgba(37,99,235,0.12)}
.filter-btn[data-el="physical"].active{border-color:var(--coral);color:var(--coral);background:rgba(255,111,97,0.12)}
.filter-btn[data-el="all"].active{border-color:#fff;color:#fff;background:rgba(255,255,255,0.08)}

/* Legend */
#legend{position:fixed;bottom:80px;left:16px;z-index:100;display:flex;flex-direction:column;gap:8px;font-size:13px;background:rgba(8,8,24,0.75);padding:14px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(10px)}
#legend .item{display:flex;align-items:center;gap:10px}
#legend .dot{width:12px;height:12px;border-radius:50%}
#legend .lbl{color:var(--text-dim)}
#legend .size-demo{display:flex;align-items:center;gap:6px;margin-top:6px;padding-top:8px;border-top:1px solid rgba(255,255,255,0.08)}
#legend .size-dot{border-radius:50%;background:rgba(255,255,255,0.3)}

/* Timeline */
#timeline-bar{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);z-index:110;display:flex;align-items:center;gap:12px;background:rgba(8,8,24,0.88);padding:10px 24px;border-radius:28px;border:1px solid rgba(255,255,255,0.1);backdrop-filter:blur(12px)}
#timeline-bar .tl-label{font-size:13px;color:var(--text-dim);white-space:nowrap;min-width:70px;text-align:center}
#timeline-slider{-webkit-appearance:none;appearance:none;width:clamp(180px,35vw,420px);height:6px;border-radius:3px;background:linear-gradient(90deg,var(--gold),var(--blue),var(--coral));outline:none;cursor:pointer}
#timeline-slider::-webkit-slider-thumb{-webkit-appearance:none;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 0 12px rgba(255,255,255,0.5);cursor:pointer}
#timeline-slider::-moz-range-thumb{width:20px;height:20px;border-radius:50%;background:#fff;border:none;box-shadow:0 0 12px rgba(255,255,255,0.5);cursor:pointer}

/* Footer */
#footer{position:fixed;bottom:4px;left:0;right:0;z-index:100;text-align:center;padding:4px;font-size:11px;color:var(--text-dim);letter-spacing:2px}

/* Tooltip */
#tooltip{position:fixed;z-index:200;background:var(--panel-bg);border:1px solid rgba(255,255,255,0.12);border-radius:14px;padding:16px 20px;max-width:340px;pointer-events:none;opacity:0;transition:opacity 0.2s;backdrop-filter:blur(14px);box-shadow:0 8px 40px rgba(0,0,0,0.7)}
#tooltip.visible{opacity:1}
#tooltip .tt-element{font-size:11px;letter-spacing:2px;text-transform:uppercase;margin-bottom:4px}
#tooltip .tt-title{font-size:16px;font-weight:600;margin-bottom:6px}
#tooltip .tt-desc{font-size:13px;color:var(--text-dim);line-height:1.5}
#tooltip .tt-date{font-size:11px;color:var(--text-dim);margin-top:6px;opacity:0.7}
#tooltip .tt-cat{font-size:10px;color:var(--text-dim);margin-top:4px;opacity:0.5;letter-spacing:1px}

/* Detail panel */
#detail-panel{position:fixed;top:0;right:-500px;width:min(460px,92vw);height:100%;z-index:300;background:var(--panel-bg);border-left:1px solid rgba(255,255,255,0.1);transition:right 0.4s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;backdrop-filter:blur(20px)}
#detail-panel.open{right:0}
#detail-panel .dp-close{position:sticky;top:0;right:0;width:100%;padding:14px 22px;text-align:right;cursor:pointer;font-size:24px;color:var(--text-dim);background:linear-gradient(180deg,var(--panel-bg),transparent);z-index:1}
#detail-panel .dp-close:hover{color:#fff}
#detail-panel .dp-body{padding:0 28px 40px}
#detail-panel .dp-element{font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-bottom:6px}
#detail-panel .dp-title{font-size:22px;font-weight:600;margin-bottom:16px;line-height:1.4}
#detail-panel .dp-section{margin-bottom:18px}
#detail-panel .dp-section h3{font-size:13px;color:var(--text-dim);letter-spacing:1px;margin-bottom:8px;text-transform:uppercase}
#detail-panel .dp-section p{font-size:14px;line-height:1.8;color:var(--text)}
#detail-panel .dp-tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
#detail-panel .dp-tag{font-size:12px;padding:4px 12px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);color:var(--text-dim);cursor:default}
#detail-panel .dp-tag.clickable{cursor:pointer;transition:all 0.2s}
#detail-panel .dp-tag.clickable:hover{background:rgba(255,255,255,0.08)}
#detail-panel .dp-timeline{list-style:none;padding:0;margin-top:8px}
#detail-panel .dp-timeline li{position:relative;padding:6px 0 6px 22px;font-size:13px;color:var(--text);line-height:1.5}
#detail-panel .dp-timeline li::before{content:'';position:absolute;left:0;top:12px;width:9px;height:9px;border-radius:50%;border:2px solid var(--c,#fff)}

/* Loading */
#loading{position:fixed;top:0;left:0;width:100%;height:100%;z-index:999;background:var(--bg);display:flex;align-items:center;justify-content:center;flex-direction:column;transition:opacity 0.6s}
#loading.hide{opacity:0;pointer-events:none}
#loading .spinner{width:50px;height:50px;border:3px solid rgba(255,255,255,0.1);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite}
#loading .lt{margin-top:20px;font-size:14px;color:var(--text-dim);letter-spacing:3px}
@keyframes spin{to{transform:rotate(360deg)}}

/* Hint */
#hint{position:fixed;bottom:56px;left:50%;transform:translateX(-50%);z-index:90;font-size:12px;color:var(--text-dim);opacity:0.5;pointer-events:none;letter-spacing:1px;transition:opacity 1s}

@media(max-width:768px){
  #legend{bottom:76px;left:8px;padding:10px 14px;font-size:11px}
  #header .desc{display:none}
  #detail-panel{width:100vw;right:-100vw}
  #filters{top:auto;bottom:76px;left:auto;right:8px;flex-direction:column}
  .filter-btn{font-size:11px;padding:5px 14px}
  #event-count{top:auto;bottom:76px;left:50%;transform:translateX(-50%);right:auto;font-size:12px;padding:6px 14px}
  #timeline-bar{bottom:18px;padding:8px 16px}
  #hint{bottom:54px;font-size:10px}
}
</style>
</head>

<div id="tooltip">

// ============ STARFIELD ============
function createStarfield() {
  const count = 4000;
  const geo = new THREE.BufferGeometry();
  const pos = new Float32Array(count * 3);
  const col = new Float32Array(count * 3);
  const siz = new Float32Array(count);
  const colors = [
    new THREE.Color(0xffffff), new THREE.Color(0xD4A843),
    new THREE.Color(0x2563eb), new THREE.Color(0xFF6F61),
    new THREE.Color(0x8888ff)
  ];
  for (let i = 0; i < count; i++) {
    const r = 200 + Math.random() * 600;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    pos[i*3]   = r * Math.sin(phi) * Math.cos(theta);
    pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
    pos[i*3+2] = r * Math.cos(phi);
    const c = colors[Math.floor(Math.random() * colors.length)];
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b;
    siz[i] = Math.random() * 2 + 0.5;
  }
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
  geo.setAttribute('aSize', new THREE.BufferAttribute(siz, 1));

  const mat = new THREE.ShaderMaterial({
    uniforms: { uTime: { value: 0 } },
    vertexShader: `
      attribute float aSize;
      varying vec3 vColor;
      varying float vAlpha;
      uniform float uTime;
      void main() {
        vColor = color;
        vec4 mvPos = modelViewMatrix * vec4(position, 1.0);
        float twinkle = sin(uTime * 2.0 + position.x * 0.1 + position.y * 0.1) * 0.3 + 0.7;
        vAlpha = twinkle;
        gl_PointSize = aSize * (300.0 / -mvPos.z) * twinkle;
        gl_Position = projectionMatrix * mvPos;
      }
    `,
    fragmentShader: `
      varying vec3 vColor;
      varying float vAlpha;
      void main() {
        float d = length(gl_PointCoord - 0.5);
        if (d > 0.5) discard;
        float alpha = smoothstep(0.5, 0.1, d) * vAlpha * 0.8;
        gl_FragColor = vec4(vColor, alpha);
      }
    `,
    vertexColors: true,
    transparent: true,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  return new THREE.Points(geo, mat);
}
const starfield = createStarfield();
scene.add(starfield);

function createNebula() {

      color: nebulaColors[i % nebulaColors.length],

      side: THREE.BackSide,
      depthWrite: false
    });
    const mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(
      (Math.random() - 0.5) * 300,
      (Math.random() - 0.5) * 300,
      (Math.random() - 0.5) * 300
    );
    group.add(mesh);
  }
  return group;
}

// ============ TEXT SPRITE HELPER ============
function createTextSprite(text, subText, color, scale) {
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');
  canvas.width = 512; canvas.height = 256;
  ctx.fillStyle = 'transparent';
  ctx.fillRect(0, 0, 512, 256);
  ctx.font = 'bold 48px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = color || '#ffffff';
  ctx.textAlign = 'center';
  ctx.shadowColor = color || '#ffffff';
  ctx.shadowBlur = 20;
  ctx.fillText(text, 256, 100);
  ctx.font = '28px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.fillStyle = 'rgba(200,200,220,0.7)';
  ctx.shadowBlur = 10;
  ctx.fillText(subText, 256, 160);
  const tex = new THREE.CanvasTexture(canvas);
  tex.needsUpdate = true;
  const mat = new THREE.SpriteMaterial({ map: tex, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending });
  const sprite = new THREE.Sprite(mat);
  const s = scale || 16;
  sprite.scale.set(s, s * 0.5, 1);
  return sprite;
}

// ============ LIGHT CONES (from element nodes) ============
const coneGroup = new THREE.Group();
scene.add(coneGroup);
const coneMaterials = [];
const CONE_LENGTH = 48;
const CONE_RADIUS = 22;

function createLightCone(el) {
  const group = new THREE.Group();
  const dir = el.coneDir;
  const color = el.color;

  // Cone surface
  const coneGeo = new THREE.ConeGeometry(CONE_RADIUS, CONE_LENGTH, 24, 12, true);
  const coneMat = new THREE.ShaderMaterial({
    uniforms: {
      uColor: { value: new THREE.Color(color) },
      uTime: { value: 0 },
      uOpacity: { value: 0.15 }
    },
    vertexShader: `
      varying vec2 vUv;
      void main() {
        vUv = uv;
        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
      }
    `,
    fragmentShader: `
      uniform vec3 uColor;
      uniform float uTime;
      uniform float uOpacity;
      varying vec2 vUv;
      void main() {
        float flow = sin(vUv.y * 20.0 - uTime * 3.0) * 0.5 + 0.5;
        float band = smoothstep(0.3, 0.7, flow);
        float edge = smoothstep(0.0, 0.05, vUv.x) * smoothstep(1.0, 0.95, vUv.x);
        float alpha = (0.04 + band * 0.08) * uOpacity;
        float gridY = smoothstep(0.48, 0.5, fract(vUv.y * 12.0)) * (1.0 - smoothstep(0.5, 0.52, fract(vUv.y * 12.0)));
        float gridX = smoothstep(0.48, 0.5, fract(vUv.x * 8.0)) * (1.0 - smoothstep(0.5, 0.52, fract(vUv.x * 8.0)));
        alpha += (gridY + gridX) * 0.06 * uOpacity;
        gl_FragColor = vec4(uColor, alpha);
      }
    `,
    transparent: true,
    side: THREE.DoubleSide,
    depthWrite: false,
    blending: THREE.AdditiveBlending
  });
  coneMaterials.push(coneMat);
  const cone = new THREE.Mesh(coneGeo, coneMat);

  // Rotate cone so its tip (-Y after rotation) points along coneDir from ORIGIN
  const up = new THREE.Vector3(0, 1, 0);
  const quat = new THREE.Quaternion().setFromUnitVectors(up, dir.clone().negate());
  cone.quaternion.copy(quat);
  // Cone center: tip at ORIGIN, base at ORIGIN + dir*CONE_LENGTH
  cone.position.copy(ORIGIN.clone().add(dir.clone().multiplyScalar(CONE_LENGTH / 2)));
  group.add(cone);

  // Wireframe overlay
  const wireGeo = new THREE.WireframeGeometry(coneGeo);
  const wireMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.1, blending: THREE.AdditiveBlending });
  const wire = new THREE.LineSegments(wireGeo, wireMat);
  wire.quaternion.copy(quat);
  wire.position.copy(cone.position);
  group.add(wire);

  // Central axis line from origin to cone base
  const beamGeo = new THREE.BufferGeometry().setFromPoints([
    ORIGIN.clone(),
    ORIGIN.clone().add(dir.clone().multiplyScalar(CONE_LENGTH))
  ]);
  const beamMat = new THREE.LineBasicMaterial({ color, transparent: true, opacity: 0.15, blending: THREE.AdditiveBlending });
  group.add(new THREE.Line(beamGeo, beamMat));

  // Cone base label (far end = "future")
  const tipPos = ORIGIN.clone().add(dir.clone().multiplyScalar(CONE_LENGTH + 4));
  return { group, tipPos };
}

Object.values(ELEMENTS).forEach(el => {
  const { group, tipPos } = createLightCone(el);
  coneGroup.add(group);
  el.coneTip = tipPos;

  const sprite = createTextSprite('未来 · ' + el.name, el.nameEn + ' Future', el.colorStr, 11);

// ============ NODE LAYOUT (3D) — events inside cones ============
const nodeMap = {};
NODES.forEach(n => nodeMap[n.id] = n);

function layoutNodes3D() {
  const groups = { humanities:[], digital:[], physical:[] };
  NODES.forEach(n => groups[n.el].push(n));

  Object.keys(groups).forEach(elKey => {
    const el = ELEMENTS[elKey];
    let nodes = groups[elKey];
    const dir = el.coneDir;
    // Base position is ORIGIN (cone tip); nodes spread outward into cone
    const basePos = ORIGIN;

    // Orthogonal basis for cone cross-section
    const up = Math.abs(dir.y) > 0.9 ? new THREE.Vector3(1,0,0) : new THREE.Vector3(0,1,0);
    const side1 = new THREE.Vector3().crossVectors(dir, up).normalize();
    const side2 = new THREE.Vector3().crossVectors(dir, side1).normalize();

    // Sort by date: earliest first (closer to origin), null dates last (farther)
    nodes.sort((a, b) => {
      if (a.dateNum === null && b.dateNum === null) return 0;
      if (a.dateNum === null) return 1;
      if (b.dateNum === null) return -1;
      return a.dateNum - b.dateNum;
    });

    // Group by category for angular spread
    const cats = {};
    nodes.forEach(n => {
      if (!cats[n.category]) cats[n.category] = [];
      cats[n.category].push(n);
    });
    const catKeys = Object.keys(cats);

    // Assign positions: distance based on time order
    nodes.forEach((n, idx) => {
      const total = nodes.length;
      // Distance along cone from ORIGIN: earliest=closer (~7), late=farther (~32)
      // Element node sits at ELEM_DIST (17); events extend beyond it toward cone base
      const t = total > 1 ? idx / (total - 1) : 0.5;
      let dist = 7 + t * 25;

      // Importance offset: big nodes slightly closer
      if (n.importance === 'big') dist -= 1.5;
      if (n.importance === 'small') dist += 1.5;

      // Angular spread by category
      const catIdx = catKeys.indexOf(n.category);
      const catAngle = ((catIdx / Math.max(catKeys.length - 1, 1)) - 0.5) * 1.4;
      const catNodes = cats[n.category];
      const subIdx = catNodes.indexOf(n);
      const subSpread = Math.min(catNodes.length, 5) * 0.25;
      const subAngle = catAngle + ((subIdx / Math.max(catNodes.length - 1, 1)) - 0.5) * subSpread;

      // Radius at this distance (cone widens)
      const coneRadiusAtDist = (dist / CONE_LENGTH) * CONE_RADIUS;
      const r = coneRadiusAtDist * (0.25 + Math.random() * 0.55);

      // Build absolute position
      const pos = basePos.clone();
      pos.add(dir.clone().multiplyScalar(dist));
      pos.add(side1.clone().multiplyScalar(Math.cos(subAngle) * r));
      pos.add(side2.clone().multiplyScalar(Math.sin(subAngle) * r));

      // Z-depth variation
      pos.z += (Math.random() - 0.5) * 2.5;

      n.position = pos;
      n.radius = n.importance === 'big' ? 1.9 : (n.importance === 'medium' ? 1.15 : 0.7);
    });
  });
}
layoutNodes3D();

  ctx.fillStyle = 'rgba(8,8,24,0.7)';

  ctx.fill();

// ============ CONNECTION LINES ============
const lineGroup = new THREE.Group();
scene.add(lineGroup);
const connectionLines = [];

function createConnection(a, b) {
  const na = nodeMap[a], nb = nodeMap[b];
  if (!na || !nb) return null;
  const isCross = na.el !== nb.el;
  const colorA = new THREE.Color(ELEMENTS[na.el].color);
  const colorB = new THREE.Color(ELEMENTS[nb.el].color);

  const start = na.position.clone();
  const end = nb.position.clone();
  const mid = start.clone().add(end).multiplyScalar(0.5);
  const centerDir = mid.clone().normalize();
  mid.add(centerDir.multiplyScalar(3 + Math.random() * 4));

  const curve = new THREE.QuadraticBezierCurve3(start, mid, end);
  const points = curve.getPoints(isCross ? 40 : 24);
  const geo = new THREE.BufferGeometry().setFromPoints(points);

  const colors = [];
  for (let i = 0; i < points.length; i++) {
    const t = i / (points.length - 1);
    const c = colorA.clone().lerp(colorB, t);
    colors.push(c.r, c.g, c.b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));

  let mat;
  if (isCross) {
    mat = new THREE.LineDashedMaterial({
      vertexColors: true, transparent: true, opacity: 0.3,
      dashSize: 1.5, gapSize: 0.8, linewidth: 1
    });
  } else {
    mat = new THREE.LineBasicMaterial({
      vertexColors: true, transparent: true, opacity: 0.2,
      blending: THREE.AdditiveBlending, linewidth: 1
    });
  }

  const line = new THREE.Line(geo, mat);
  if (isCross) line.computeLineDistances();
  line.userData = { from: a, to: b, isCross, baseOpacity: isCross ? 0.3 : 0.2 };
  return line;
}

CONNECTIONS.forEach(([a, b]) => {
  const line = createConnection(a, b);
  if (line) {
    lineGroup.add(line);
    connectionLines.push(line);
  }
});

    const start = na.position.clone();

    const centerDir = mid.clone().normalize();
    mid.add(centerDir.multiplyScalar(3 + (idx % 5)));
    const curve = new THREE.QuadraticBezierCurve3(start, mid, end);

    const color = na.el === nb.el ? ELEMENTS[na.el].color : 0xffffff;
    const count = 3 + Math.floor(Math.random() * 4);

    for (let i = 0; i < count; i++) {
      const geo = new THREE.SphereGeometry(0.15, 8, 8);
      const mat = new THREE.MeshBasicMaterial({

      });

      particle.userData = {

        speed: 0.002 + Math.random() * 0.004,

      };

// ============ RAYCASTER / INTERACTION ============
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let hoveredNode = null;
let selectedNode = null;

function onPointerMove(event) {
  const rect = renderer.domElement.getBoundingClientRect();
  mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;

  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeMeshes, false);

  if (intersects.length > 0) {
    const mesh = intersects[0].object;
    if (hoveredNode !== mesh) {
      if (hoveredNode) resetNodeVisual(hoveredNode);
      hoveredNode = mesh;
      hoverNodeVisual(mesh);
      document.body.style.cursor = 'pointer';
      showTooltip(event, mesh.userData.node);
    } else {
      moveTooltip(event);
    }
    controls.autoRotate = false;
  } else {
    if (hoveredNode) {
      resetNodeVisual(hoveredNode);
      hoveredNode = null;
      document.body.style.cursor = 'default';
      hideTooltip();
    }
  }
}

function hoverNodeVisual(mesh) {
  mesh.scale.setScalar(1.5);
  if (mesh.userData.glowMesh) mesh.userData.glowMesh.scale.setScalar(1.3);
  mesh.material.emissiveIntensity = 1.2;
}

function resetNodeVisual(mesh) {
  if (mesh === selectedNode) return;
  mesh.scale.setScalar(1);
  if (mesh.userData.glowMesh) mesh.userData.glowMesh.scale.setScalar(1);
  mesh.material.emissiveIntensity = mesh.userData.node.importance === 'big' ? 0.8 : 0.5;
}

function onPointerClick(event) {
  if (controls.getAzimuthalAngle && isDragging) return;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(nodeMeshes, false);
  if (intersects.length > 0) {
    const mesh = intersects[0].object;
    const n = mesh.userData.node;
    selectedNode = mesh;
    focusOnNode(mesh);
    showDetail(n);
    highlightConnections(n);
  }
}

let isDragging = false;
let downPos = { x: 0, y: 0 };
renderer.domElement.addEventListener('pointerdown', e => {
  isDragging = false;
  downPos = { x: e.clientX, y: e.clientY };
});
renderer.domElement.addEventListener('pointermove', e => {
  if (Math.abs(e.clientX - downPos.x) > 5 || Math.abs(e.clientY - downPos.y) > 5) {
    isDragging = true;
  }
});
renderer.domElement.addEventListener('pointerup', e => {
  if (!isDragging) onPointerClick(e);
});

renderer.domElement.addEventListener('pointermove', onPointerMove);
renderer.domElement.addEventListener('touchstart', () => { controls.autoRotate = false; }, { passive: true });

// ============ CAMERA FOCUS ============
function focusOnNode(mesh) {
  const worldPos = new THREE.Vector3();
  mesh.getWorldPosition(worldPos);
  const targetPos = worldPos.clone();
  const distance = mesh.userData.node.radius * 12 + 8;
  const cameraDir = new THREE.Vector3().subVectors(camera.position, controls.target).normalize();
  const newCamPos = targetPos.clone().add(cameraDir.multiplyScalar(distance));

  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const duration = 800;
  const startTime = performance.now();

  function animateCamera() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(startPos, newCamPos, ease);
    controls.target.lerpVectors(startTarget, targetPos, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(animateCamera);
  }
  animateCamera();
}

function resetCamera() {
  const startPos = camera.position.clone();
  const startTarget = controls.target.clone();
  const endPos = new THREE.Vector3(18, 12, 65);
  const endTarget = new THREE.Vector3(-18, 0, 0);
  const duration = 800;
  const startTime = performance.now();

  function animateCamera() {
    const elapsed = performance.now() - startTime;
    const t = Math.min(elapsed / duration, 1);
    const ease = t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2;
    camera.position.lerpVectors(startPos, endPos, ease);
    controls.target.lerpVectors(startTarget, endTarget, ease);
    controls.update();
    if (t < 1) requestAnimationFrame(animateCamera);
  }
  animateCamera();
  selectedNode = null;
  clearHighlights();
}

  tooltip.querySelector('.tt-date').textContent = '📅 ' + n.date;
  tooltip.querySelector('.tt-cat').textContent = '[' + n.category + ']';
  tooltip.classList.add('visible');
  moveTooltip(e);
}
function moveTooltip(e) {
  let x = e.clientX + 18, y = e.clientY + 18;
  if (x + 360 > window.innerWidth) x = e.clientX - 360;
  if (y + 200 > window.innerHeight) y = e.clientY - 200;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }

// ============ DETAIL PANEL ============
const panel = document.getElementById('detail-panel');
const dpBody = document.getElementById('dp-body');

window.closeDetail = function() {
  panel.classList.remove('open');
  selectedNode = null;
  clearHighlights();
  resetCamera();
};

window.showDetail = function(n) {
  const el = ELEMENTS[n.el];
  let html = `
    <div class="dp-element" style="color:${el.colorStr}">${el.name} · ${el.nameEn} · ${n.category}</div>
    <div class="dp-title">${n.title}</div>
    <div class="dp-section"><h3>概述</h3><p>${n.detail}</p></div>
    <div class="dp-section"><h3>时间</h3><p>${n.date}</p></div>
  `;
  if (n.timeline) {
    html += `<div class="dp-section"><h3>关键节点</h3><ul class="dp-timeline">`;
    n.timeline.forEach(t => {
      html += `<li style="--c:${el.colorStr}"><span>${t}</span></li>`;
    });
    html += `</ul></div>`;
  }
  if (n.connections && n.connections.length > 0) {
    html += `<div class="dp-section"><h3>关联事件</h3><div class="dp-tags">`;
    n.connections.forEach(cid => {
      const cn = nodeMap[cid];
      if (cn) {
        const ccol = ELEMENTS[cn.el].colorStr;
        html += `<span class="dp-tag clickable" style="border-color:${ccol}60;color:${ccol}" onclick="window._jumpTo('${cid}')">${cn.short}</span>`;
      }
    });
    html += `</div></div>`;
  }
  html += `<div class="dp-section"><h3>标签</h3><div class="dp-tags">`;
  n.tags.forEach(t => { html += `<span class="dp-tag" style="border-color:${el.colorStr}40;color:${el.colorStr}">${t}</span>`; });
  html += `</div></div>`;
  dpBody.innerHTML = html;
  panel.classList.add('open');
};

window._jumpTo = function(id) {
  const n = nodeMap[id];
  if (!n) return;
  const mesh = nodeMeshes.find(m => m.userData.nodeId === id);
  if (mesh) {
    selectedNode = mesh;
    focusOnNode(mesh);
    showDetail(n);
    highlightConnections(n);
  }
};

function highlightConnections(n) {
  const connIds = new Set(n.connections || []);
  connIds.add(n.id);

  nodeMeshes.forEach(m => {
    if (connIds.has(m.userData.nodeId)) {
      m.material.opacity = 1;
      m.material.emissiveIntensity = m.userData.node.importance === 'big' ? 1.0 : 0.7;
    } else {
      m.material.opacity = 0.15;
    }
  });

  labelSprites.forEach(s => {
    s.material.opacity = connIds.has(s.userData.nodeId) ? 1 : 0.1;
  });

  connectionLines.forEach(line => {
    if (line.userData.from === n.id || line.userData.to === n.id) {
      line.material.opacity = line.userData.isCross ? 0.7 : 0.5;
      line.material.color && line.material.color.set(0xffffff);
    } else {
      line.material.opacity = 0.03;
    }
  });

  flowParticles.forEach(p => { p.material.opacity = 0.1; });
}

function clearHighlights() {
  nodeMeshes.forEach(m => {
    m.material.opacity = 0.95;
    m.material.emissiveIntensity = m.userData.node.importance === 'big' ? 0.8 : 0.5;
    m.scale.setScalar(1);
    if (m.userData.glowMesh) m.userData.glowMesh.scale.setScalar(1);
  });
  labelSprites.forEach(s => { s.material.opacity = 1; });
  connectionLines.forEach(line => {
    line.material.opacity = line.userData.baseOpacity;
  });
  flowParticles.forEach(p => {
    p.material.opacity = p.userData.baseOpacity;
  });
}

// ============ FILTERS ============
let currentFilter = 'all';
let timelineValue = 100;

window.filterBy = function(el) {
  currentFilter = el;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.el === el);
  });
  applyFilters();
};

function applyFilters() {
  let visibleCount = 0;
  NODES.forEach(n => {
    let show = true;
    if (currentFilter !== 'all' && n.el !== currentFilter) show = false;
    if (timelineValue < 100 && n.dateNum !== null) {
      const cutoff = 2025.5 + (timelineValue / 100) * 1.5;
      if (n.dateNum > cutoff) show = false;
    }
    n.visible = show;
    if (show) visibleCount++;
  });

  nodeMeshes.forEach(m => {
    m.visible = m.userData.node.visible;
    if (m.userData.glowMesh) m.userData.glowMesh.visible = m.userData.node.visible;
  });
  labelSprites.forEach(s => {
    const n = nodeMap[s.userData.nodeId];
    s.visible = n && n.visible;
  });
  pulseRings.forEach(r => {
    const n = nodeMap[r.userData.parentMesh.userData.nodeId];
    r.visible = n && n.visible;
  });

  connectionLines.forEach(line => {
    const fromNode = nodeMap[line.userData.from];
    const toNode = nodeMap[line.userData.to];
    line.visible = fromNode.visible && toNode.visible;
  });

  flowParticles.forEach(p => { p.visible = true; });

  document.getElementById('visible-count').textContent = visibleCount;
}

document.getElementById('total-count').textContent = NODES.length;
document.getElementById('visible-count').textContent = NODES.length;

const slider = document.getElementById('timeline-slider');
const tlStart = document.getElementById('tl-start');

function getTimelineLabel(val) {
  if (val >= 100) return '全部时间';
  const dateVal = 2025.5 + (val / 100) * 1.5;
  const year = Math.floor(dateVal);
  const month = Math.round((dateVal - year) * 12) + 1;
  return `${year}-${String(month).padStart(2,'0')}`;
}

slider.addEventListener('input', () => {
  timelineValue = parseInt(slider.value);
  tlStart.textContent = getTimelineLabel(timelineValue);
  applyFilters();
});

// ============ KEYBOARD ============
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeDetail();
});

// ============ RESIZE ============
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// ============ ANIMATION LOOP ============
const clock = new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);
  const time = clock.getElapsedTime();

  // Starfield
  starfield.material.uniforms.uTime.value = time;

  // Cone shaders
  coneMaterials.forEach(mat => { mat.uniforms.uTime.value = time; });

  // Origin
  haloMat.uniforms.uTime.value = time;
  const corePulse = 1 + Math.sin(time * 2) * 0.1;
  core.scale.setScalar(corePulse);
  originLight.intensity = 2.5 + Math.sin(time * 3) * 0.5;

  // Gravity waves
  waveRings.forEach(ring => {
    const phase = (time * 0.4 + ring.userData.phase) % 1;
    const scale = 3 + phase * 28;
    ring.scale.setScalar(scale);
    ring.material.opacity = (1 - phase) * (ring.userData.tilted ? 0.2 : 0.35);
    if (!ring.userData.tilted) {
      const localCam = camera.position.clone().sub(centerGroup.position);
      ring.lookAt(localCam);
    }
  });

  // Element nodes: breathing + rotating rings
  elementMeshes.forEach((mesh, i) => {
    const s = 1 + Math.sin(time * 1.8 + i * 2) * 0.06;
    mesh.scale.setScalar(s);
    if (mesh.userData.glowMesh) {
      mesh.userData.glowMesh.material.uniforms.uTime.value = time;
      mesh.userData.glowMesh.scale.setScalar(s * 1.05);
    }
  });

  // Rotate torus rings around elements
  elementGroup.children.forEach(child => {
    if (child.userData && child.userData.rotSpeed) {
      if (child.userData.rotAxis === 'y') {
        child.rotation.y += child.userData.rotSpeed * 0.01;
      } else {
        child.rotation.x += child.userData.rotSpeed * 0.01;
      }
    }
  });

  // Node pulse animation
  nodeMeshes.forEach(mesh => {
    if (mesh === hoveredNode || mesh === selectedNode) return;
    const n = mesh.userData.node;
    if (n.importance === 'big') {
      const s = 1 + Math.sin(time * 2 + mesh.position.x) * 0.06;
      mesh.scale.setScalar(s);
      if (mesh.userData.glowMesh) {
        mesh.userData.glowMesh.material.uniforms.uTime.value = time;
        mesh.userData.glowMesh.scale.setScalar(s * 1.1);
      }
    } else if (n.importance === 'medium') {
      const s = 1 + Math.sin(time * 1.5 + mesh.position.y) * 0.04;
      mesh.scale.setScalar(s);
    }
  });

  // Pulse rings
  pulseRings.forEach(ring => {
    const phase = (time * 0.5 + ring.userData.phase) % (Math.PI * 2);
    const t = (Math.sin(phase) + 1) / 2;
    ring.scale.setScalar(1 + t * 1.5);
    ring.material.opacity = (1 - t) * 0.4;
    ring.lookAt(camera.position);
  });

  // Flow particles on connections
  flowParticles.forEach(p => {
    p.userData.t += p.userData.speed;
    if (p.userData.t > 1) p.userData.t = 0;
    const pos = p.userData.curve.getPoint(p.userData.t);
    p.position.copy(pos);
    const scale = 0.5 + Math.sin(p.userData.t * Math.PI) * 1;
    p.scale.setScalar(scale);
  });

  // Subtle cone group rotation
  coneGroup.rotation.y = Math.sin(time * 0.08) * 0.03;

  controls.update();
  renderer.render(scene, camera);
}

// ============ INIT ============
setTimeout(() => {
  document.getElementById('loading').classList.add('hide');
  setTimeout(() => document.getElementById('loading').style.display = 'none', 600);
}, 500);

setTimeout(() => {
  const hint = document.getElementById('hint');
  if (hint) hint.style.opacity = '0';
}, 6000);

let interactTimeout;
function resetInteractTimer() {
  clearTimeout(interactTimeout);
  controls.autoRotate = false;
  interactTimeout = setTimeout(() => {
    if (!selectedNode) controls.autoRotate = true;
  }, 8000);
}
renderer.domElement.addEventListener('pointerdown', resetInteractTimer);
renderer.domElement.addEventListener('wheel', resetInteractTimer);
renderer.domElement.addEventListener('touchstart', resetInteractTimer, { passive: true });

animate();
applyFilters();
</script>
</body>
</html>
