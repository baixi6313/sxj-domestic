<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>SXJ 对话框 · 实时计入公示墙</title>
<style>
:root{--red:#A32D2D;--red-dark:#7C1F1F;--bg:#F7F5F2;--panel:#fff;--ink:#2B2B2B;--line:#E8E2DA;--user:#A32D2D}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column}
.top{background:linear-gradient(135deg,var(--red-dark),var(--red));color:#fff;padding:10px 14px;display:flex;align-items:center;gap:8px;flex-shrink:0}
.top .dot{width:7px;height:7px;border-radius:50%;background:#7CE38B;display:inline-block}
.top b{font-size:14px;letter-spacing:.5px}
.top select{margin-left:auto;border:none;border-radius:7px;padding:5px 8px;font-size:12px;background:rgba(255,255,255,.16);color:#fff;max-width:42%}
.top select option{color:#333}
.sub{background:#FFF6F0;color:var(--red-dark);font-size:11.5px;padding:5px 12px;border-bottom:1px solid var(--line);flex-shrink:0}
#chat{flex:1;overflow-y:auto;padding:16px 12px;scroll-behavior:smooth}
.msg{display:flex;margin-bottom:14px;gap:8px}
.msg .avatar{width:28px;height:28px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:bold;font-family:serif}
.msg.ai .avatar{background:var(--red);color:#fff}
.msg.user{flex-direction:row-reverse}
.msg.user .avatar{background:#3D3D3D;color:#fff;font-size:11px}
.bubble{max-width:82%;padding:10px 13px;border-radius:12px;font-size:13.5px;line-height:1.7;word-break:break-word}
.msg.ai .bubble{background:var(--panel);border:1px solid var(--line);border-top-left-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.04)}
.msg.user .bubble{background:var(--user);color:#fff;border-top-right-radius:4px;white-space:pre-wrap}
.bubble p{margin:5px 0}.bubble p:first-child{margin-top:0}.bubble p:last-child{margin-bottom:0}
.bubble code{background:rgba(163,45,45,.08);color:var(--red-dark);padding:1px 4px;border-radius:4px;font-size:12px;font-family:Consolas,Menlo,monospace}
.bubble .cursor{display:inline-block;width:7px;height:14px;background:var(--red);vertical-align:-2px;animation:blink .9s infinite}
@keyframes blink{50%{opacity:0}}
.err{background:#FDECEC;border:1px solid #F2B8B8;color:#8C1F1F}
.fbnote{text-align:center;font-size:11px;color:#8a6d1b;background:#FFF8E6;border:1px solid #F0E2B6;border-radius:8px;padding:4px 10px;margin:0 auto 10px;max-width:82%}
.chips{display:flex;flex-wrap:wrap;gap:6px;padding:0 12px 10px;flex-shrink:0}
.chip{border:1px solid var(--line);background:#fff;color:var(--red-dark);border-radius:999px;padding:6px 11px;font-size:12px;cursor:pointer}
.chip:hover{background:#FFF3EC}
.inbar{display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line);background:#fff;flex-shrink:0;align-items:flex-end}
textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;font-size:13.5px;font-family:inherit;outline:none;max-height:110px;background:#FCFBF9}
textarea:focus{border-color:var(--red)}
button.send{background:var(--red);color:#fff;border:none;border-radius:10px;padding:9px 16px;font-size:13.5px;font-weight:600;cursor:pointer}
button.send:disabled{opacity:.5;cursor:default}
.foot{font-size:10.5px;color:#9B948A;text-align:center;padding:4px 0 8px;background:var(--bg);flex-shrink:0}
.foot a{color:#A32D2D;text-decoration:none}
.attbtn{background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font-size:15px;cursor:pointer;color:#6B6B6B;flex-shrink:0}
.attbtn:hover{border-color:var(--red);color:var(--red)}
.atts{display:none;flex-wrap:wrap;gap:6px;padding:0 12px 8px;flex-shrink:0}
.atts.on{display:flex}
.att{position:relative;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:9px;padding:4px 7px;font-size:11px;max-width:47%}
.att img{width:30px;height:30px;object-fit:cover;border-radius:5px}
.att .fico{font-size:17px;line-height:1}
.att .nm{max-width:110px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#555}
.att .rm{cursor:pointer;color:#9B948A;font-size:13px;padding:0 2px}
.att .rm:hover{color:var(--red)}
.bubble .fimg{max-width:190px;max-height:190px;border-radius:8px;display:block;margin:6px 0 2px;border:1px solid rgba(255,255,255,.4);cursor:zoom}
.msg.ai .bubble .fimg{border-color:var(--line)}
.bubble .flink{font-size:11.5px;word-break:break-all;margin-top:4px}
.bubble .flink a{color:inherit;text-decoration:underline}
.bimg-mask{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:center;justify-content:center;z-index:99;cursor:zoom-out}
.bimg-mask img{max-width:94%;max-height:92%;border-radius:10px}
@media (max-width:600px){textarea{font-size:16px}}
</style>
</head>
<body>
<div class="top"><span class="dot"></span><b>SXJ 对话框</b><select id="modelSel"></select></div>
<div class="sub">对话将实时计入公示墙（公开可见 · 只增不删 · 请勿输入隐私）</div>
<div id="chat"><div class="wrap" id="wrap">
  <div id="hello" style="text-align:center;padding:26px 10px 10px;color:#6B6B6B;font-size:13px">
    <div style="font-size:34px">🦞</div>
    <p style="margin-top:8px">你好，我是 SXJ 模型。<br>在这里的对话会<b style="color:#A32D2D">直接计入公示墙</b>。</p>
  </div>
</div></div>
<div class="chips" id="chips">
  <span class="chip">什么是事现鉴？</span><span class="chip">Gzz 编码是什么？</span><span class="chip">公示墙怎么参与？</span>
</div>
<div class="atts" id="atts"></div>
<div class="inbar">
  <button class="attbtn" id="attbtn" title="添加图片/附件（≤8MB，最多4个）">📎</button>
  <input type="file" id="file" multiple accept="image/png,image/jpeg,image/gif,image/webp,.pdf,.txt,.md,.json,.csv,.html" style="display:none">
  <textarea id="input" rows="1" placeholder="输入你的问题…（Enter 发送，可先点📎加图片/附件）"></textarea>
  <button class="send" id="send">发送</button>
</div>
<div class="bimg-mask" id="bimgmask"><img id="bimg" alt=""></div>
<div class="foot">内容由 AI 生成，可能存在偏差 · <a href="/" target="_blank">hygzz.cn</a></div>
<script>
(function(){
  var SID=(localStorage.getItem('sxj_box_sid')||(function(){var s='box'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);localStorage.setItem('sxj_box_sid',s);return s})());
  var history=[];
  var chatEl=document.getElementById('chat'),wrap=document.getElementById('wrap'),hello=document.getElementById('hello'),
      input=document.getElementById('input'),sendBtn=document.getElementById('send'),modelSel=document.getElementById('modelSel');
  var busy=false;var SEL_LABELS={};
  var pend=[];
  var attsEl=document.getElementById('atts'),attbtn=document.getElementById('attbtn'),fileEl=document.getElementById('file'),
      maskEl=document.getElementById('bimgmask'),maskImg=document.getElementById('bimg');
  function renderAtts(){
    attsEl.innerHTML='';attsEl.className='atts'+(pend.length?' on':'');
    pend.forEach(function(a,i){
      var d=document.createElement('div');d.className='att';
      d.innerHTML=(a.img?'<img src="'+a.data+'">':'<span class="fico">📄</span>')+'<span class="nm">'+esc(a.name)+'</span><span class="rm">✕</span>';
      d.querySelector('.rm').onclick=function(){pend.splice(i,1);renderAtts()};
      attsEl.appendChild(d);
    });
  }
  attbtn.onclick=function(){fileEl.click()};
  fileEl.onchange=function(){
    Array.prototype.forEach.call(fileEl.files,function(f){
      if(pend.length>=4)return;
      if(f.size>8*1024*1024){alert('附件过大（限8MB）：'+f.name);return}
      var r=new FileReader();
      r.onload=function(){
        var isImg=(f.type||'').indexOf('image/')===0;
        pend.push({name:f.name,data:r.result,img:isImg,size:f.size});renderAtts();
      };
      r.readAsDataURL(f);
    });
    fileEl.value='';
  };
  maskEl.onclick=function(){maskEl.style.display='none'};
  function bindZoom(bub){
    Array.prototype.forEach.call(bub.querySelectorAll('.fimg'),function(im){
      im.onclick=function(){maskImg.src=im.src;maskEl.style.display='flex'};
    });
  }
  async function uploadAtts(){
    var out=[];
    for(var i=0;i<pend.length;i++){
      var a=pend[i];
      var _ctl2=('AbortController' in window)?new AbortController():null;
      var _to2=_ctl2?setTimeout(function(){try{_ctl2.abort()}catch(_){}},30000):null;
      var res;
      try{res=await fetch('/api/upload',{method:'POST',headers:{'Content-Type':'application/json'},signal:_ctl2?_ctl2.signal:undefined,
        body:JSON.stringify({name:a.name,data:a.data.split(',')[1]||''})})}finally{if(_to2)clearTimeout(_to2)}
      var j=await res.json();
      if(j&&j.ok)out.push({url:j.url,name:a.name,img:a.img});
    }
    return out;
  }
  function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
  function md(t){
    var s=esc(t);
    s=s.replace(/```([\s\S]*?)```/g,function(_,c){return '<pre style="background:#2B2B2B;color:#E8E2DA;padding:10px;border-radius:8px;overflow-x:auto;font-size:11.5px;margin:6px 0"><code>'+c+'</code></pre>'});
    s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>');
    return s.split(/\n{2,}/).map(function(p){return '<p>'+p.replace(/\n/g,'<br>')+'</p>'}).join('');
  }
  function scroll(){chatEl.scrollTop=chatEl.scrollHeight}
  function addMsg(role,html){
    var d=document.createElement('div');d.className='msg '+role;
    d.innerHTML='<div class="avatar">'+(role==='ai'?'鉴':'访')+'</div><div class="bubble">'+html+'</div>';
    wrap.appendChild(d);scroll();return d.querySelector('.bubble');
  }
  function loadModels(){
    fetch('/api/models').then(function(r){return r.json()}).then(function(j){
      var ms=((j&&j.models)||[]).filter(function(m){return m.ready});
      if(!ms.length)return;
      modelSel.innerHTML='';
      ms.forEach(function(m){var o=document.createElement('option');o.value=m.id;var dn=(m.status==='down'||m.status==='nokey'||m.status==='limited');o.textContent=m.label+(dn?'（维护中）':'');o.title=(m.sub||'')+(m.desc?' · '+m.desc:'');if(dn)o.disabled=true;SEL_LABELS[m.id]=m.label;modelSel.appendChild(o)});
    }).catch(function(){});
  }
  async function stream(body,el){
    var _ctl=('AbortController' in window)?new AbortController():null;
    var _to=_ctl?setTimeout(function(){try{_ctl.abort()}catch(_){}},60000):null;
    var res;
    try{res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),signal:_ctl?_ctl.signal:undefined})}
    finally{if(_to)clearTimeout(_to)}
    if(!res.ok){var e=null;try{e=await res.json()}catch(_){};throw new Error((e&&e.error)||('HTTP '+res.status))}
    var fb='';try{fb=res.headers.get('x-sxj-fallback-from')||''}catch(_){}
    var reader=res.body.getReader(),dec=new TextDecoder(),buf='',full='',cur=null;
    while(true){
      var r=await reader.read();if(r.done)break;
      buf+=dec.decode(r.value,{stream:true});
      var lines=buf.split('\n');buf=lines.pop();
      for(var i=0;i<lines.length;i++){
        var line=lines[i].trim();
        if(line.indexOf('data:')!==0)continue;
        var d=line.slice(5).trim();
        if(d==='[DONE]')continue;
        try{
          var j=JSON.parse(d),delta=j.choices&&j.choices[0]&&j.choices[0].delta&&j.choices[0].delta.content;
          if(delta){
            if(!cur){cur=document.createElement('div');cur.className='msg ai';
              cur.innerHTML='<div class="avatar">鉴</div><div class="bubble"><span class="cursor"></span></div>';
              if(fb&&fb!==body.model){var nt=document.createElement('div');nt.className='fbnote';nt.textContent='⚡ '+(SEL_LABELS[fb]||fb)+' 上游繁忙，已自动切换';wrap.appendChild(nt)}
              wrap.appendChild(cur);try{if(el&&el.parentNode&&el!==cur)el.parentNode.removeChild(el)}catch(_){};el=cur.querySelector('.bubble');full='';}
            full+=delta;el.innerHTML=md(full)+'<span class="cursor"></span>';scroll();
          }
        }catch(_){}
      }
    }
    if(cur){el.innerHTML=md(full)}
    return full;
  }
  async function ask(text){
    if(busy||(!text&&!pend.length))return;
    busy=true;sendBtn.disabled=true;
    hello.style.display='none';
    try{
    var atts=[];
    try{atts=await uploadAtts()}catch(_){}
    pend=[];renderAtts();
    var full=text||'';
    if(atts.length){full+=(full?'\n':'')+'[附件] '+atts.map(function(a){return a.url}).join(' ')}
    var uh=md(text||'');
    atts.forEach(function(a){
      uh+=a.img?'<img class="fimg" src="'+a.url+'" alt="附件图片">':'<div class="flink">📄 <a href="'+a.url+'" target="_blank">'+esc(a.name)+'</a></div>';
    });
    bindZoom(addMsg('user',uh));
    history.push({role:'user',content:full});
    var placeholder=addMsg('ai','<span style="opacity:.55">鉴思考中…<span class="cursor"></span></span>');
    var err=null,reply='';
    try{reply=await stream({messages:history,model:modelSel.value,stream:true,session:SID},placeholder)}
    catch(e){err=e}
    if(err){
      placeholder.classList.add('err');
      placeholder.innerHTML='⚠️ '+esc(err.message)+'<br><small>请稍后重试。</small>';
      history.pop();
    }else if(reply){
      history.push({role:'assistant',content:reply});
    }
    }finally{busy=false;sendBtn.disabled=false;input.focus();}
  }
  sendBtn.onclick=function(){var t=input.value.trim();input.value='';input.style.height='auto';ask(t)};  // 纯附件发送：ask 内部以 pend 判空
  input.addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();sendBtn.click()}});
  input.addEventListener('input',function(){input.style.height='auto';input.style.height=Math.min(input.scrollHeight,110)+'px'});
  Array.prototype.forEach.call(document.querySelectorAll('.chip'),function(c){
    c.onclick=function(){c.remove();ask(c.textContent)};
  });
  loadModels();
})();
</script>
<script src="/cv_widget.js" defer></script></body>
</html>
