<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>数智社会工程学 — 白玺著</title>
<style>
:root {
  --bg-deep: #060b1a;
  --bg-card: rgba(255,255,255,.06);
  --gold: #c9a84c;
  --gold-glow: rgba(201,168,76,.3);
  --blue: #7eb8da;
  --blue-glow: rgba(126,184,218,.25);
  --text: #e8ecf4;
  --text-dim: #8899b4;
  --radius: 12px;
  --radius-pill: 28px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html { font-size: 16px; -webkit-font-smoothing: antialiased; }

body {
  font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", system-ui, sans-serif;
  background: var(--bg-deep);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow-x: hidden;
  position: relative;
}

/* Starfield */
.stars {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background:
    radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,.6), transparent),
    radial-gradient(1px 1px at 25% 35%, rgba(255,255,255,.4), transparent),
    radial-gradient(1.5px 1.5px at 40% 10%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 55% 45%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 70% 20%, rgba(255,255,255,.5), transparent),
    radial-gradient(1px 1px at 85% 55%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 15% 65%, rgba(255,255,255,.35), transparent),
    radial-gradient(1.5px 1.5px at 60% 70%, rgba(255,255,255,.45), transparent),
    radial-gradient(1px 1px at 90% 30%, rgba(255,255,255,.3), transparent),
    radial-gradient(1px 1px at 35% 80%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 75% 85%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 50% 55%, rgba(255,255,255,.4), transparent),
    radial-gradient(1px 1px at 20% 90%, rgba(255,255,255,.25), transparent),
    radial-gradient(1px 1px at 80% 8%, rgba(255,255,255,.35), transparent),
    radial-gradient(1px 1px at 45% 92%, rgba(255,255,255,.3), transparent),
    radial-gradient(1.5px 1.5px at 5% 40%, rgba(255,255,255,.4), transparent);
}

/* Radiating lines */
.radial-lines {
  position: fixed; inset: 0; pointer-events: none; z-index: 0;
  background: conic-gradient(
    from 0deg at 50% 8%,
    transparent 0deg,
    rgba(201,168,76,.06) 0.5deg,
    transparent 1deg,
    transparent 2deg,
    rgba(201,168,76,.04) 2.5deg,
    transparent 3deg,
    transparent 5deg,
    rgba(201,168,76,.05) 5.5deg,
    transparent 6deg,
    transparent 10deg,
    rgba(201,168,76,.03) 10.5deg,
    transparent 11deg,
    transparent 15deg,
    rgba(201,168,76,.06) 15.5deg,
    transparent 16deg,
    transparent 20deg,
    rgba(201,168,76,.04) 20.5deg,
    transparent 21deg,
    transparent 25deg,
    rgba(201,168,76,.05) 25.5deg,
    transparent 26deg,
    transparent 30deg,
    rgba(201,168,76,.03) 30.5deg,
    transparent 31deg,
    transparent 35deg,
    rgba(201,168,76,.04) 35.5deg,
    transparent 36deg,
    transparent 40deg,
    rgba(201,168,76,.06) 40.5deg,
    transparent 41deg,
    transparent 45deg,
    rgba(201,168,76,.03) 45.5deg,
    transparent 46deg,
    transparent 50deg,
    rgba(201,168,76,.05) 50.5deg,
    transparent 51deg,
    transparent 55deg,
    rgba(201,168,76,.04) 55.5deg,
    transparent 56deg,
    transparent 60deg,
    rgba(201,168,76,.06) 60.5deg,
    transparent 61deg,
    transparent 65deg,
    rgba(201,168,76,.03) 65.5deg,
    transparent 66deg,
    transparent 70deg,
    rgba(201,168,76,.05) 70.5deg,
    transparent 71deg,
    transparent 75deg,
    rgba(201,168,76,.04) 75.5deg,
    transparent 76deg,
    transparent 80deg,
    rgba(201,168,76,.06) 80.5deg,
    transparent 81deg,
    transparent 85deg,
    rgba(201,168,76,.03) 85.5deg,
    transparent 86deg,
    transparent 90deg,
    rgba(201,168,76,.05) 90.5deg,
    transparent 91deg,
    transparent 360deg
  );
}

/* Gold glow center */
.glow-center {
  position: fixed;
  top: 6%;
  left: 50%;
  transform: translateX(-50%);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(201,168,76,.18) 0%, rgba(201,168,76,.04) 40%, transparent 70%);
  pointer-events: none;
  z-index: 1;
  animation: breathe 4s ease-in-out infinite;
}

@keyframes breathe {
  0%, 100% { opacity: .7; transform: translateX(-50%) scale(1); }
  50% { opacity: 1; transform: translateX(-50%) scale(1.15); }
}

/* Poster */
.poster {
  position: relative; z-index: 2;
  width: 100%; max-width: 680px;
  padding: 60px 32px 48px;
  display: flex; flex-direction: column; align-items: center;
  text-align: center;
}

/* Mothership label */
.mothership {
  font-size: .85rem;
  letter-spacing: .15em;
  color: var(--blue);
  text-shadow: 0 0 20px var(--blue-glow);
  margin-bottom: 6px;
  font-weight: 300;
}
.mothership-en {
  font-size: .65rem;
  letter-spacing: .12em;
  color: var(--text-dim);
  margin-bottom: 32px;
  text-transform: uppercase;
}

/* Evolution capsules */
.capsules {
  display: flex;
  flex-direction: column;
  gap: 10px;
  width: 100%;
  max-width: 420px;
  margin-bottom: 40px;
}

.capsule {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 20px;
  border-radius: var(--radius-pill);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
  border: 1px solid;
  transition: transform .3s, box-shadow .3s;
}

.capsule:hover {
  transform: translateX(4px);
}

.capsule-icon {
  width: 10px; height: 10px;
  border-radius: 50%;
  flex-shrink: 0;
}

.capsule-body { text-align: left; flex: 1; }
.capsule-name { font-size: 1rem; font-weight: 600; letter-spacing: .04em; }
.capsule-desc { font-size: .72rem; margin-top: 2px; }

.cap-1 {
  background: rgba(126,184,218,.1);
  border-color: rgba(126,184,218,.3);
  box-shadow: 0 0 24px rgba(126,184,218,.08);
}
.cap-1:hover { box-shadow: 0 0 36px rgba(126,184,218,.16); }
.cap-1 .capsule-icon { background: var(--blue); box-shadow: 0 0 8px var(--blue-glow); }
.cap-1 .capsule-name { color: var(--blue); }
.cap-1 .capsule-desc { color: rgba(126,184,218,.6); }

.cap-2 {
  background: rgba(201,168,76,.08);
  border-color: rgba(201,168,76,.25);
  box-shadow: 0 0 24px rgba(201,168,76,.06);
}
.cap-2:hover { box-shadow: 0 0 36px rgba(201,168,76,.14); }
.cap-2 .capsule-icon { background: var(--gold); box-shadow: 0 0 8px var(--gold-glow); }
.cap-2 .capsule-name { color: var(--gold); }
.cap-2 .capsule-desc { color: rgba(201,168,76,.6); }

.cap-3 {
  background: rgba(220,140,120,.08);
  border-color: rgba(220,140,120,.25);
  box-shadow: 0 0 24px rgba(220,140,120,.06);
}
.cap-3:hover { box-shadow: 0 0 36px rgba(220,140,120,.14); }
.cap-3 .capsule-icon { background: #dc8c78; box-shadow: 0 0 8px rgba(220,140,120,.3); }
.cap-3 .capsule-name { color: #e8c4b8; }
.cap-3 .capsule-desc { color: rgba(220,140,120,.6); }

/* Arrow connectors */
.arrow-down {
  width: 0; height: 0;
  border-left: 6px solid transparent;
  border-right: 6px solid transparent;
  border-top: 8px solid rgba(201,168,76,.25);
  align-self: center;
}

/* Main title */
.title-block { margin-bottom: 16px; }
.title-1 {
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  font-weight: 700;
  letter-spacing: .08em;
  color: #e8ecf4;
  text-shadow: 0 0 40px rgba(200,210,230,.2);
}
.title-2 {
  font-size: clamp(2.2rem, 6vw, 3.2rem);
  font-weight: 700;
  letter-spacing: .08em;
  color: var(--gold);
  text-shadow: 0 0 40px var(--gold-glow);
}

/* Subtitle */
.subtitle {
  font-size: .88rem;
  color: var(--text-dim);
  letter-spacing: .1em;
  margin-bottom: 28px;
  font-weight: 300;
}

/* Description */
.desc {
  font-size: .8rem;
  color: rgba(126,184,218,.7);
  line-height: 1.8;
  max-width: 480px;
  margin-bottom: 36px;
}

/* Author */
.author {
  font-size: .85rem;
  color: var(--text-dim);
  letter-spacing: .06em;
  margin-bottom: 6px;
}

/* Tech info */
.tech-info {
  font-size: .62rem;
  color: rgba(136,153,180,.5);
  letter-spacing: .05em;
  margin-bottom: 24px;
  line-height: 1.6;
}

/* Bottom badge */
.bottom-badge {
  display: inline-block;
  padding: 10px 28px;
  border-radius: var(--radius-pill);
  border: 1px solid rgba(201,168,76,.3);
  background: rgba(201,168,76,.06);
  color: var(--gold);
  font-size: .8rem;
  letter-spacing: .06em;
  font-weight: 500;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

/* Frame borders */
.frame { position: fixed; pointer-events: none; z-index: 3; }
.frame-outer {
  inset: 16px;
  border: 1px solid rgba(201,168,76,.12);
}
.frame-inner {
  inset: 24px;
  border: 1px solid rgba(201,168,76,.06);
}

/* Print */
@media print {
  body { background: #060b1a; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  .stars, .radial-lines, .glow-center { display: none; }
  .frame { display: none; }
  .poster { padding: 40px 32px; }
}

/* Mobile */
@media (max-width: 480px) {
  .poster { padding: 40px 20px 36px; }
  .capsules { max-width: 100%; }
  .capsule { padding: 12px 16px; }
  .frame-outer { inset: 8px; }
  .frame-inner { inset: 14px; }
}
</style>
</head>
<body>

<div class="stars"></div>
<div class="radial-lines"></div>
<div class="glow-center"></div>

<div class="frame frame-outer"></div>
<div class="frame frame-inner"></div>

<article class="poster">

  <div class="mothership">寰宇光锥舟</div>

      <div class="capsule-icon"></div>

  <div class="title-block">

</html>
