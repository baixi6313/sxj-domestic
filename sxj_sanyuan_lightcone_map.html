:root{

html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;color:var(--text)}

#event-count{position:fixed;top:12px;right:20px;z-index:110;font-size:13px;color:var(--text-dim);background:rgba(10,10,26,0.8);padding:8px 16px;border-radius:20px;border:1px solid rgba(255,255,255,0.08);backdrop-filter:blur(8px)}

#filters{position:fixed;top:12px;left:20px;z-index:110;display:flex;gap:6px;flex-wrap:wrap}
.filter-btn{font-size:11px;padding:5px 14px;border-radius:16px;border:1px solid rgba(255,255,255,0.12);background:rgba(10,10,26,0.7);color:var(--text-dim);cursor:pointer;transition:all 0.3s;backdrop-filter:blur(6px);user-select:none}
.filter-btn:hover{border-color:rgba(255,255,255,0.3);color:var(--text)}
.filter-btn.active{color:#fff;border-color:rgba(255,255,255,0.4)}
.filter-btn[data-el="humanities"].active{border-color:var(--gold);color:var(--gold);background:rgba(212,168,67,0.1)}
.filter-btn[data-el="digital"].active{border-color:var(--blue);color:var(--blue);background:rgba(37,99,235,0.1)}
.filter-btn[data-el="physical"].active{border-color:var(--coral);color:var(--coral);background:rgba(255,111,97,0.1)}

#legend .dot{width:8px;height:8px;border-radius:50%}

#legend .size-dot{border-radius:50%;background:rgba(255,255,255,0.3)}

#map-inner{position:absolute;transform-origin:0 0;transition:none}
.node{position:absolute;border-radius:50%;cursor:pointer;transition:transform 0.3s,box-shadow 0.3s,opacity 0.4s;z-index:20;display:flex;align-items:center;justify-content:center}

.node.dimmed{opacity:0.12;pointer-events:none}
.node .core{border-radius:50%;position:relative}
.node .pulse{position:absolute;border-radius:50%;animation:pulse 3s ease-in-out infinite;opacity:0}
.node .label{position:absolute;white-space:nowrap;font-size:10px;color:var(--text);opacity:0;transition:opacity 0.3s;pointer-events:none;text-shadow:0 0 8px rgba(0,0,0,0.9);font-weight:300;letter-spacing:1px}

.node:hover .label,.node:hover .date-tag{opacity:1}
.node.show-label .label{opacity:0.8}
.node.show-label .date-tag{opacity:0.5}

#tooltip .tt-title{font-size:14px;font-weight:600;margin-bottom:4px}
#tooltip .tt-desc{font-size:11px;color:var(--text-dim);line-height:1.5}
#tooltip .tt-date{font-size:10px;color:var(--text-dim);margin-top:4px;opacity:0.7}
#tooltip .tt-cat{font-size:9px;color:var(--text-dim);margin-top:3px;opacity:0.5;letter-spacing:1px}
#detail-panel{position:fixed;top:0;right:-480px;width:min(440px,90vw);height:100%;z-index:300;background:var(--panel-bg);border-left:1px solid rgba(255,255,255,0.08);transition:right 0.4s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;backdrop-filter:blur(16px)}

#detail-panel .dp-element{font-size:10px;letter-spacing:3px;text-transform:uppercase;margin-bottom:4px}

#detail-panel .dp-section p{font-size:13px;line-height:1.7;color:var(--text)}

.svg-layer{position:absolute;top:0;left:0;pointer-events:none;z-index:5}

</style>

<div id="map-container">

// ============ LAYOUT ============
const W = 3200, H = 3200;
const CX = W/2, CY = H/2;
const REGION_R = 580;

function getElCenter(elKey) {
  const a = ELEMENTS[elKey].angle * Math.PI / 180;
  return { x: CX + Math.cos(a) * 440, y: CY + Math.sin(a) * 440 };
}

// Importance sizes
const SIZE_MAP = { big: 20, medium: 13, small: 8 };

function layoutNodes() {
  const groups = { humanities:[], digital:[], physical:[] };
  NODES.forEach(n => groups[n.el].push(n));

  Object.keys(groups).forEach(elKey => {
    const center = getElCenter(elKey);
    const nodes = groups[elKey];
    const baseAngle = ELEMENTS[elKey].angle * Math.PI / 180;

    // Sort: big nodes closer to center, small further
    nodes.sort((a,b) => {
      const order = {big:0, medium:1, small:2};
      return (order[a.importance]||1) - (order[b.importance]||1);
    });

    // Category sub-groups for label
    const cats = {};
    nodes.forEach(n => {
      if (!cats[n.category]) cats[n.category] = [];
      cats[n.category].push(n);
    });

    const spread = Math.PI * 0.65;
    const catKeys = Object.keys(cats);
    let nodeIdx = 0;

    catKeys.forEach((cat, ci) => {
      const catNodes = cats[cat];
      catNodes.forEach((n, ni) => {
        const totalInCat = catNodes.length;
        const catCenter = baseAngle + ((ci / Math.max(catKeys.length-1,1)) - 0.5) * spread * 0.7;
        const catSpread = spread * 0.25 * Math.min(totalInCat, 4);
        const subAngle = catCenter + ((ni / Math.max(totalInCat-1,1)) - 0.5) * catSpread;

        // Distance: big closer, small further
        const distBase = 200;
        const distStep = 70;
        const importanceOffset = {big: 0, medium: 60, small: 130};
        const dist = distBase + (importanceOffset[n.importance]||60) + ni * distStep;

        n.x = center.x + Math.cos(subAngle) * dist;
        n.y = center.y + Math.sin(subAngle) * dist;
        n.size = SIZE_MAP[n.importance] || 12;
        nodeIdx++;
      });
    });
  });

  // Anti-overlap: simple force push
  for (let iter = 0; iter < 30; iter++) {
    let moved = false;
    for (let i = 0; i < NODES.length; i++) {
      for (let j = i+1; j < NODES.length; j++) {
        const a = NODES[i], b = NODES[j];
        const dx = b.x - a.x, dy = b.y - a.y;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const minDist = (a.size + b.size) * 2 + 20;
        if (dist < minDist && dist > 0) {
          const push = (minDist - dist) / 2;
          const nx = dx/dist, ny = dy/dist;
          a.x -= nx * push * 0.5;
          a.y -= ny * push * 0.5;
          b.x += nx * push * 0.5;
          b.y += ny * push * 0.5;
          moved = true;
        }
      }
    }
    if (!moved) break;
  }
}
layoutNodes();

// ============ STAR CANVAS ============
const canvas = document.getElementById('star-canvas');
const ctx = canvas.getContext('2d');
let stars = [];
function initStars() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  stars = [];
  for (let i = 0; i < 350; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.5 + 0.3,
      a: Math.random(),
      da: (Math.random() - 0.5) * 0.01,
      color: ['#fff','#D4A843','#2563eb','#FF6F61'][Math.floor(Math.random()*4)]
    });
  }
}
function drawStars() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  stars.forEach(s => {
    s.a += s.da;
    if (s.a > 1 || s.a < 0.2) s.da *= -1;
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = s.color;
    ctx.globalAlpha = s.a * 0.7;
    ctx.fill();
  });
  ctx.globalAlpha = 1;
  requestAnimationFrame(drawStars);
}
initStars();
drawStars();
window.addEventListener('resize', initStars);

clDiv.style.top = (CY + 20) + 'px';
clDiv.style.width = '160px';
clDiv.innerHTML = `<div class="cl-main" style="color:#fff">事现鉴 · 光锥原点</div><div class="cl-sub">Light-Cone Origin</div>`;
inner.appendChild(clDiv);

// Element region labels
Object.keys(ELEMENTS).forEach(elKey => {
  const c = getElCenter(elKey);
  const el = ELEMENTS[elKey];
  const d = document.createElement('div');
  d.style.cssText = `position:absolute;left:${c.x}px;top:${c.y - REGION_R - 16}px;transform:translateX(-50%);text-align:center;pointer-events:none;z-index:15`;
  d.innerHTML = `<div style="font-size:16px;font-weight:300;color:${el.color};letter-spacing:4px;opacity:0.5">${el.name}</div><div style="font-size:9px;color:var(--text-dim);letter-spacing:2px;opacity:0.35">${el.nameEn}</div>`;
  inner.appendChild(d);
});

// Category sub-labels
function addCatLabel(text, x, y, color) {
  const d = document.createElement('div');
  d.className = 'cat-label';
  d.style.cssText = `left:${x}px;top:${y}px;color:${color};transform:translateX(-50%)`;
  d.textContent = text;
  inner.appendChild(d);
}

// Nodes rendering
const nodeElements = {};
NODES.forEach(n => {
  const el = ELEMENTS[n.el];
  const col = el.color;
  const sz = n.size;
  const div = document.createElement('div');
  div.className = 'node';
  div.style.cssText = `left:${n.x - sz}px;top:${n.y - sz}px;width:${sz*2}px;height:${sz*2}px;`;

  const pulseSize = n.importance === 'big' ? sz*2 : (n.importance === 'medium' ? sz*1.6 : 0);
  const hasPulse = n.importance === 'big';

  let pulseHtml = '';
  if (hasPulse) {
    pulseHtml = `<div class="pulse" style="width:${pulseSize}px;height:${pulseSize}px;border:1px solid ${col}"></div>`;
  }

  div.innerHTML = `
    ${pulseHtml}
    <div class="core" style="width:${sz*1.4}px;height:${sz*1.4}px;background:radial-gradient(circle at 40% 40%,${col},rgba(0,0,0,0.3));box-shadow:0 0 ${sz}px ${col},0 0 ${sz*2}px ${col}40;border:1px solid ${col}80"></div>
    <div class="label" style="top:${sz + 8}px;left:50%;transform:translateX(-50%);color:${col}">${n.short}</div>
    <div class="date-tag" style="bottom:${-sz - 4}px;left:50%;transform:translateX(-50%);color:${col}90">${n.date}</div>
  `;
  div.dataset.id = n.id;
  div.dataset.el = n.el;
  div.addEventListener('mouseenter', e => showTooltip(e, n));
  div.addEventListener('mouseleave', hideTooltip);
  div.addEventListener('click', () => showDetail(n));
  inner.appendChild(div);
  nodeElements[n.id] = div;
});

// ============ TOOLTIP ============
const tooltip = document.getElementById('tooltip');
function showTooltip(e, n) {
  const el = ELEMENTS[n.el];
  tooltip.querySelector('.tt-element').textContent = el.name + ' · ' + el.nameEn;
  tooltip.querySelector('.tt-element').style.color = el.color;
  tooltip.querySelector('.tt-title').textContent = n.title;
  tooltip.querySelector('.tt-desc').textContent = n.desc;
  tooltip.querySelector('.tt-date').textContent = '📅 ' + n.date;
  tooltip.querySelector('.tt-cat').textContent = '[' + n.category + ']';
  tooltip.classList.add('visible');
  positionTooltip(e);
}
function positionTooltip(e) {
  let x = e.clientX + 16, y = e.clientY + 16;
  if (x + 340 > window.innerWidth) x = e.clientX - 340;
  if (y + 180 > window.innerHeight) y = e.clientY - 180;
  tooltip.style.left = x + 'px';
  tooltip.style.top = y + 'px';
}
function hideTooltip() { tooltip.classList.remove('visible'); }
document.addEventListener('mousemove', e => { if (tooltip.classList.contains('visible')) positionTooltip(e); });

// ============ DETAIL PANEL ============
const panel = document.getElementById('detail-panel');
const dpBody = document.getElementById('dp-body');
function showDetail(n) {
  const el = ELEMENTS[n.el];
  let html = `
    <div class="dp-element" style="color:${el.color}">${el.name} · ${el.nameEn} · ${n.category}</div>
    <div class="dp-title">${n.title}</div>
    <div class="dp-section"><h3>概述</h3><p>${n.detail}</p></div>
    <div class="dp-section"><h3>时间</h3><p>${n.date}</p></div>
  `;
  if (n.timeline) {
    html += `<div class="dp-section"><h3>关键节点</h3><ul class="dp-timeline">`;
    n.timeline.forEach(t => {
      html += `<li style="--c:${el.color}"><span style="color:var(--text)">${t}</span></li>`;
    });
    html += `</ul></div>`;
  }
  // Show connections
  if (n.connections && n.connections.length > 0) {
    html += `<div class="dp-section"><h3>关联事件</h3><div class="dp-tags">`;
    n.connections.forEach(cid => {
      const cn = nodeMap[cid];
      if (cn) {
        const ccol = ELEMENTS[cn.el].color;
        html += `<span class="dp-tag" style="border-color:${ccol}40;color:${ccol};cursor:pointer" onclick="showDetail(nodeMap['${cid}'])">${cn.short}</span>`;
      }
    });
    html += `</div></div>`;
  }
  html += `<div class="dp-section"><h3>标签</h3><div class="dp-tags">`;
  n.tags.forEach(t => { html += `<span class="dp-tag" style="border-color:${el.color}40;color:${el.color}">${t}</span>`; });
  html += `</div></div>`;
  dpBody.innerHTML = html;
  panel.classList.add('open');

  // Highlight connected nodes
  highlightConnections(n);
}
function closeDetail() {
  panel.classList.remove('open');
  clearHighlights();
}
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDetail(); });

function highlightConnections(n) {
  if (!n.connections) return;
  // Dim all, then highlight connected
  Object.values(nodeElements).forEach(el => el.style.opacity = '0.2');
  // Highlight self
  if (nodeElements[n.id]) nodeElements[n.id].style.opacity = '1';
  // Highlight connected
  n.connections.forEach(cid => {
    if (nodeElements[cid]) nodeElements[cid].style.opacity = '1';
  });
  // Highlight connection lines
  document.querySelectorAll('.conn-line').forEach(line => {
    const from = line.dataset.from, to = line.dataset.to;
    if (from === n.id || to === n.id) {
      line.setAttribute('opacity', '0.6');
      line.setAttribute('stroke-width', '2');
    } else {
      line.setAttribute('opacity', '0.03');
    }
  });
}
function clearHighlights() {
  Object.values(nodeElements).forEach(el => el.style.opacity = '');
  document.querySelectorAll('.conn-line').forEach(line => {
    const isCross = nodeMap[line.dataset.from]?.el !== nodeMap[line.dataset.to]?.el;
    line.setAttribute('opacity', isCross ? '0.18' : '0.12');
    line.setAttribute('stroke-width', isCross ? '0.8' : '0.6');
  });
  applyFilters(); // reapply current filter
}

// ============ FILTERS ============
let currentFilter = 'all';
let timelineValue = 100;

function filterBy(el) {
  currentFilter = el;
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.el === el);
  });
  applyFilters();
}

function applyFilters() {
  let visibleCount = 0;
  NODES.forEach(n => {
    const el = nodeElements[n.id];
    if (!el) return;
    let show = true;

    // Element filter
    if (currentFilter !== 'all' && n.el !== currentFilter) show = false;

    // Timeline filter
    if (timelineValue < 100 && n.dateNum !== null) {
      const cutoff = 2025.5 + (timelineValue / 100) * 1.5; // 2025.5 to 2027.0
      if (n.dateNum > cutoff) show = false;
    }

    el.style.display = show ? '' : 'none';
    if (show) visibleCount++;
  });

  // Update connection line visibility
  document.querySelectorAll('.conn-line').forEach(line => {
    const fromEl = nodeElements[line.dataset.from];
    const toEl = nodeElements[line.dataset.to];
    const show = fromEl && toEl && fromEl.style.display !== 'none' && toEl.style.display !== 'none';
    line.style.display = show ? '' : 'none';
  });

  document.getElementById('visible-count').textContent = visibleCount;
}

document.getElementById('total-count').textContent = NODES.length;
document.getElementById('visible-count').textContent = NODES.length;

// Timeline slider
const slider = document.getElementById('timeline-slider');
const tlStart = document.getElementById('tl-start');
const tlEnd = document.getElementById('tl-end');

const TIMELINE_LABELS = {
  0: '2025-09',
  20: '2026-01',
  40: '2026-04',
  60: '2026-06',
  80: '2026-07',
  90: '2026-08初',
  95: '2026-08中',
  100: '全部时间'
};

function getTimelineLabel(val) {
  if (val >= 100) return '全部时间';
  const dateVal = 2025.5 + (val / 100) * 1.5;
  const year = Math.floor(dateVal);
  const month = Math.round((dateVal - year) * 12) + 1;
  return `${year}-${String(month).padStart(2,'0')}`;
}

slider.addEventListener('input', () => {
  timelineValue = parseInt(slider.value);
  tlStart.textContent = timelineValue >= 100 ? '全部时间' : getTimelineLabel(timelineValue);
  applyFilters();
});

// ============ PAN & ZOOM ============
let isDragging = false, startX, startY;
container.addEventListener('mousedown', e => {
  if (e.target.closest('.node')) return;
  isDragging = true;
  startX = e.clientX - tx;
  startY = e.clientY - ty;
  container.classList.add('dragging');
});
window.addEventListener('mousemove', e => {
  if (!isDragging) return;
  tx = e.clientX - startX;
  ty = e.clientY - startY;
  applyTransform();
});
window.addEventListener('mouseup', () => { isDragging = false; container.classList.remove('dragging'); });

container.addEventListener('wheel', e => {
  e.preventDefault();
  const delta = e.deltaY > 0 ? 0.92 : 1.08;
  const newScale = Math.max(0.15, Math.min(3, scale * delta));
  const mx = e.clientX, my = e.clientY;
  tx = mx - (mx - tx) * (newScale / scale);
  ty = my - (my - ty) * (newScale / scale);
  scale = newScale;
  applyTransform();
}, { passive: false });

// Touch support
let lastTouchDist = 0;
container.addEventListener('touchstart', e => {
  if (e.touches.length === 1) {
    isDragging = true;
    startX = e.touches[0].clientX - tx;
    startY = e.touches[0].clientY - ty;
  } else if (e.touches.length === 2) {
    isDragging = false;
    lastTouchDist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
  }
}, { passive: false });
container.addEventListener('touchmove', e => {
  e.preventDefault();
  if (e.touches.length === 1 && isDragging) {
    tx = e.touches[0].clientX - startX;
    ty = e.touches[0].clientY - startY;
    applyTransform();
  } else if (e.touches.length === 2) {
    const dist = Math.hypot(e.touches[0].clientX - e.touches[1].clientX, e.touches[0].clientY - e.touches[1].clientY);
    const delta = dist / lastTouchDist;
    const newScale = Math.max(0.15, Math.min(3, scale * delta));
    const mx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
    const my = (e.touches[0].clientY + e.touches[1].clientY) / 2;
    tx = mx - (mx - tx) * (newScale / scale);
    ty = my - (my - ty) * (newScale / scale);
    scale = newScale;
    lastTouchDist = dist;
    applyTransform();
  }
}, { passive: false });
container.addEventListener('touchend', () => { isDragging = false; });

// Resize
window.addEventListener('resize', () => {
  scale = Math.min(window.innerWidth / W, window.innerHeight / H) * 0.85;
  tx = (window.innerWidth - W * scale) / 2;
  ty = (window.innerHeight - H * scale) / 2;
  applyTransform();
  initStars();
});

// Initial filter apply
applyFilters();
</script>
</body>
</html>
