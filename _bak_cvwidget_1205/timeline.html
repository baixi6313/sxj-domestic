/* ===== 渲染时间轴 ===== */
(function(){
  var events = SXJ.EVENTS.filter(function(e){ return !e.placeholder; }).map(function(e){
    return { e:e, y:SXJ.eventYear(e) };
  }).filter(function(item){ return item.y !== null; }).sort(function(a,b){ return a.y - b.y; });

  var s = SXJ.stats();
  document.getElementById('statsBar').innerHTML =
    '<div class="stat-card"><div class="num">'+s.total+'</div><div class="label">真实事现</div></div>' +
    '<div class="stat-card"><div class="num">'+s.measured+'</div><div class="label">已量测 ρ</div></div>' +
    '<div class="stat-card"><div class="num">'+(s.minYear||'—')+'–'+(s.maxYear||'—')+'</div><div class="label">时间跨度</div></div>';

  var html = '';
  events.forEach(function(item){
    var e = item.e;
    var tri = SXJ.triad(e.x);
    var isMile = e.milestone;
    var cls = 'tl-item' + (isMile ? ' milestone' : '');
    var yearCls = 'tl-year' + (isMile ? ' blue' : '');
    var triTag = '<span class="tl-tag ' + e.x + '">' + (tri ? tri.short : e.x) + '</span>';
    var tier = SXJ.tier(e.y);
    var tierTag = '<span class="tl-tag">' + (tier ? tier.short : e.y) + '</span>';
    var jur = SXJ.juris(e.j);
    var jurTag = '<span class="tl-tag">' + (jur ? jur.name : e.j) + '</span>';
    var valTags = '';
    (e.parties || []).forEach(function(p){
      if(p.value) valTags += '<span class="tl-tag ' + p.value + '">' + p.value + ' ' + (p.who.length > 12 ? p.who.substring(0,12)+'…' : p.who) + '</span>';
    });
    var geoHtml = '';
    if(e.geo && e.geo.place){ geoHtml = '<div class="tl-geo">📍 ' + e.geo.place + (e.geo.precision ? ' (' + e.geo.precision + ')' : '') + '</div>'; }
    var rhoHtml = '';
    if(typeof e.rho === 'number'){ rhoHtml = ' <span style="color:' + SXJ.rhoColor(e.rho) + ';font-weight:600;font-size:.85rem">ρ=' + e.rho.toFixed(4) + '</span>'; }
    html += '<div class="' + cls + '">' +
      '<span class="' + yearCls + '">' + item.y + '</span>' +
      '<div class="tl-title">' + e.title + rhoHtml + '</div>' +
      '<div class="tl-desc">' + (e.summary ? e.summary.substring(0, 220) + (e.summary.length > 220 ? '…' : '') : '') + '</div>' +
      '<div class="tl-tags">' + triTag + tierTag + jurTag + valTags + '</div>' +
      geoHtml +
      '</div>';
  });
  document.getElementById('timeline').innerHTML = html;
})();

<script>
function toggleNav(btn){
  var d=document.getElementById('navDrop');
  var isOpen=d.classList.contains('show');
  d.classList.toggle('show');
  btn.classList.toggle('open');
  if(!isOpen){
    document.addEventListener('click',closeNavOnce);
  }
}
function closeNavOnce(e){
  var t=e.target;
  if(!t.closest('.nav-wrap')){
    var d=document.getElementById('navDrop');
    var b=document.querySelector('.nav-trigger');
    if(d)d.classList.remove('show');
    if(b)b.classList.remove('open');
    document.removeEventListener('click',closeNavOnce);
  }
}
</script>
